    <!-- Put the saved theme on the page right away, so it doesn't flash in the wrong colours. -->
    <script>
      try {
        var savedTheme = localStorage.getItem('theme');
        if (savedTheme) {
          document.documentElement.dataset.theme = savedTheme;
        }
      } catch (error) {
        // Some browsers block storage — then the default theme is used.
      }
    </script>
