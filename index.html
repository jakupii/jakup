<!doctype html>

    <meta property="og:title" content="Jakup Jakupi" />
    <meta property="og:description" content="Web Developer | IT Support Specialist · Skopje, MK" />
    <meta property="og:image" content="https://jakupjakupi.com/assets/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Jakup Jakupi — Web Developer | IT Support Specialist" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Tells search engines who this site is about. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Jakup Jakupi",
        "url": "https://jakupjakupi.com/",
        "image": "https://jakupjakupi.com/assets/og-image.jpg",
        "jobTitle": "Web Developer & IT Support Specialist",
        "address": { "@type": "PostalAddress", "addressLocality": "Skopje", "addressCountry": "MK" },
        "alumniOf": "Mother Teresa University",
        "knowsLanguage": ["sq", "en", "mk"],
        "sameAs": ["https://www.instagram.com/jwkupp/", "https://www.facebook.com/jwkupp"]
      }
    </script>

    <!-- Icons: .ico for Safari & older browsers, SVG for the rest, PNG for iPhone/iPad.
         Bump ?v= whenever the icon changes, so browsers drop their cached copy. -->
    <link rel="icon" href="/favicon.ico?v=3" sizes="32x32" />
    <link rel="icon" href="/favicon.svg?v=3" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Font: JetBrains Mono from Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap"
    />

    <link rel="stylesheet" href="/style.css?v=6" />

    <!-- Put the saved theme on the page right away, so it doesn't flash in the wrong colours. -->
    <script>
      try {
        var savedTheme = localStorage.getItem('theme');
        // Only letters, so nothing strange from storage ends up on the page.
        if (/^[a-z]+$/.test(savedTheme)) {
          document.documentElement.dataset.theme = savedTheme;
        }
      } catch (error) {
        // Some browsers block storage — then the default theme is used.
      }
    </script>
  </head>
  <body>
    <!-- Only shown when JavaScript is turned off. -->
    <noscript>
      <main class="noscript">

        <p>

        </p>
      </main>
    </noscript>

    <!-- The React app is drawn inside this box. -->
    <div id="root"></div>

    <!-- React, then the site (app.js).
         React comes from the same server as the font's extra characters (one connection less), and
         `integrity` makes the browser refuse the file if it is ever not exactly React 18.3.1.
         Bump ?v= on app.js and style.css whenever you upload a new version, so phones drop their cached copy. -->
    <script
      src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"
      integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z"
      crossorigin="anonymous"
      defer
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"
      integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1"
      crossorigin="anonymous"
      defer
    ></script>
    <script src="/app.js?v=8" defer></script>
  </body>
</html>
